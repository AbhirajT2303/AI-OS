spring.application.name=authz
management.endpoints.web.exposure.include=health

# In-memory is the default state store (ADR-0004). spring-boot-starter-data-jpa
# is a main dependency purely so PostgresAuthorizationStateStore (ENG-30) can be
# wired in when wanted; excluding these here stops every ordinary @SpringBootTest
# from also standing up a DataSource/EntityManagerFactory it never uses. The
# dedicated Postgres store test re-enables this exclusion list (sets it back to
# empty) for just that one test slice.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
